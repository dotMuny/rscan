[workspace]
members = ["crates/rscan-core", "crates/rscan-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["rscan contributors"]
keywords = ["port-scanner", "network", "security", "async", "tokio"]
categories = ["network-programming", "command-line-utilities"]

[workspace.dependencies]
rscan-core = { path = "crates/rscan-core", version = "0.1.0" }

anyhow = "1.0"
async-stream = "0.3"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
csv = "1.3"
futures = "0.3"
indicatif = "0.18"
ipnet = { version = "2.9", features = ["serde"] }
libc = "0.2"
once_cell = "1.19"
owo-colors = "4.1"
parking_lot = "0.12"
rand = "0.8"
regex = "1.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = "0.1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
x509-parser = "0.16"
etherparse = "0.16"
criterion = { version = "0.5", features = ["html_reports"] }
quick-xml = "0.41"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
